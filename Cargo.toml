[package]
name = "herdr-planner"
version = "0.4.0"
edition = "2021"
description = "Herdr Planner: a local dashboard of the herdr-projects board"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["json", "multipart"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "fs",
    "time",
    "sync",
    "net",
    "signal",
    "io-util",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
argon2 = { version = "0.5", features = ["std"] }
bcrypt = "0.17"
rand = "0.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = { version = "8.13.0", features = ["interpolate-folder-path"] }
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
moka = { version = "0.12.16", features = ["sync"] }
sha2 = "0.11.1"
base64 = "0.23.1"
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures-util = "0.3.34"
async-stream = "0.3.6"
libc = "0.2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[profile.release]
strip = true
lto = "thin"

[dev-dependencies]
tempfile = "3.27.0"
