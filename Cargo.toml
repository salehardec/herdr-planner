[package]
name = "herdr-planner"
version = "0.2.0"
edition = "2021"
description = "Herdr Planner: a local dashboard of the herdr-projects board"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["json"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "fs",
    "time",
    "sync",
    "net",
    "signal",
    "io-util",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
argon2 = { version = "0.5", features = ["std"] }
bcrypt = "0.17"
rand = "0.8"

[profile.release]
strip = true
lto = "thin"
